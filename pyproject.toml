[project]
name = "safenest"
version = "1.0.0"
description = "Nested Policy Learning: a multi-timescale safety architecture for developmentally adaptive child-AI interaction"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
