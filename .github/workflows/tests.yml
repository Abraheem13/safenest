name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The specification, simulations and verification: NumPy only.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check safenest experiments scripts tests
      - run: python -m pytest -q

  real-data-code:
    # The real-data modules, tested on synthetic inputs; no corpus is downloaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,real]"
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q
